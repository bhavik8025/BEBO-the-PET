<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:" />
    <title>Desktop Pet</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <main id="pet-wrap" aria-label="Desktop AI Pet">
      <div id="speech-bubble" role="status"></div>
      <button id="pet-button" aria-label="Open pet assistant">
        <img
          id="pet-character"
          class="pet-idle"
          src="../../../assets/icon.png"
          alt="BEBO"
          draggable="false"
        />
      </button>
      <span id="status-dot" hidden></span>

      <!-- Effect layer. BEBO's face is a fixed image and cannot change, so
           these drawn cues carry the meaning that a face normally would.
           The avatar itself is never modified. -->
      <div id="pet-fx" aria-hidden="true">
        <span class="fx-z fx-z1">z</span>
        <span class="fx-z fx-z2">z</span>
        <span class="fx-z fx-z3">z</span>
        <span class="fx-spark fx-s1"></span>
        <span class="fx-spark fx-s2"></span>
        <span class="fx-spark fx-s3"></span>
        <span class="fx-spark fx-s4"></span>
        <span class="fx-spark fx-s5"></span>
        <span class="fx-mark">?</span>
        <span class="fx-drop"></span>
        <span class="fx-yawn">~</span>
      </div>
    </main>
    <script src="./pet.js"></script>
  </body>
</html>
