<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:" />
    <title>Desktop Pet</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <main id="pet-wrap" aria-label="Desktop AI Pet">
      <div id="speech-bubble" role="status"></div>
      <button id="pet-button" aria-label="Open pet assistant">
        <img
          id="pet-character"
          class="pet-idle"
          src="../../../assets/icon.png"
          alt="BEBO"
          draggable="false"
        />
      </button>
      <span id="status-dot" hidden></span>
    </main>
    <script src="./pet.js"></script>
  </body>
</html>
